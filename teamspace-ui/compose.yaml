name: teamspace
services:
  workspace-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NEXTCLOUD_URL: http://app
      UI_ORIGIN: ${UI_ORIGIN:-http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "3000"
    networks: [ui, nextcloud]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  workspace-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports: ["0.0.0.0:8081:80"]
    networks: [ui]
    depends_on:
      workspace-api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  ui: {}
  nextcloud:
    external: true
    name: nextcloud_frontend
