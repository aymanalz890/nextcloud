server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    # Resolve again if the API container is recreated and gets a different IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://workspace-api:3000;
    proxy_pass $api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    client_body_timeout 610s;
  }
  location /assets/ { try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
